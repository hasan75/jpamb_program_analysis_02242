[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "metamorphic"
version = "0.1.0"
description = "Site finder and semantics-preserving rewrites for metamorphic testing of JPAMB analyzers"
requires-python = ">=3.13"
dependencies = [
  "jpamb",
  "tree-sitter>=0.26.0",
  "tree-sitter-java>=0.23.5",
]

[project.scripts]
metamorphic-sites = "sites:main"
metamorphic-select = "selection:main"
metamorphic-validate = "validate:main"

[tool.uv.sources]
jpamb = { path = "../../", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
